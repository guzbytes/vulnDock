services:
  db:
    build:
      context: .
      dockerfile: Docker/DockerfileMSSQL
      args:
        DB_VERSION: 2017-latest
    hostname: db
    ports:
      - "1433:1433"

  web:
    build:
      context: .
      dockerfile: Docker/DockerfileAspnet
      args:
        WEB_VERSION: "8.0"
    ports:
      - "80:80"
    depends_on:
      - db
