<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página del Blog</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="/js/navbar.js"></script>
    <script src="/js/blog-details.js" defer></script>
</head>
<body>
    <!-- Barra de navegación -->
    <header class="navbar">
        <div class="logo">
            <h1>Cyberblog</h1>
        </div>
    </header>

    <main class="main-content">
        <section id="blog-detail">
            <h2 id="blog-title"></h2>
            <p id="blog-content"></p>
            <p><strong>Autor:</strong> <span id="blog-author"></span></p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CyberBlog. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
