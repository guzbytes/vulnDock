<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página del Ticket</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="/js/ticket-details.js" defer></script>
</head>
<body>
    <!-- Barra de navegación -->
    <header class="navbar">
        <div class="logo">
            <h1>Tickets</h1>
        </div>
    </header>

    <main class="main-content">
        <section id="ticket-detail">
            <h2 id="ticket-title"></h2>
            <p id="ticket-content"></p>
            <p><strong>Autor:</strong> <span id="ticket-author"></span></p>

            <div id="comments">
                <h3>Comentarios</h3>
                <ul id="comment-list"></ul>

                <form id="comment-form" enctype="multipart/form-data">
                    <textarea id="comment-text" placeholder="Escribe un comentario..." required></textarea>
                    <input type="text" id="comment-author" placeholder="Nombre del autor" required>
                    <input type="file" id="comment-files" multiple>
                    <button type="submit" id="submit-comment">Comentar</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
