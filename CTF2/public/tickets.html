<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página del Ticket</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/tickets.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h1>Tickets</h1>
        </div>
    </header>

    <main class="main-content">
        <section id="ticket-list">
            <div id="tickets">
            </div>
        </section>

        <section id="new-ticket">
            <h2>Crea un Nuevo Ticket</h2>
            <form id="ticketForm">
                <input type="text" id="title" name="title" placeholder="Título" required>
                <textarea id="content" name="content" placeholder="Describe tu ticket aquí..." required></textarea>
                <input type="text" id="author" name="author" placeholder="Tu nombre" required>
                <button type="submit">Crear Ticket</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>
    <p id="ticketMessage"></p>

    
</body>
</html>
